name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: TypeScript + contracts (contracts · shared · art · sdk · server · web)
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # English only (the translations under apps/web/src/i18n/locales/ excepted): fails on any Turkish-specific letter (c-cedilla, g-breve, dotless i, o-umlaut,
      # s-cedilla, u-umlaut and their capitals) in a tracked text file. The letters are written as
      # PCRE code points so this file passes its own check; images are skipped as binaries.
      - name: English-only guard (no Turkish letters in tracked text files)
        # git grep exits 0 on a match, 1 on no match, anything else on an error (which must fail too).
        run: |
          rc=0
          LC_ALL=C.UTF-8 git grep -InP '[\x{e7}\x{11f}\x{131}\x{f6}\x{15f}\x{fc}\x{c7}\x{11e}\x{130}\x{d6}\x{15e}\x{dc}]' -- . ':!*.webp' ':!*.png' ':!*.jpg' ':!apps/web/src/i18n/locales/*' || rc=$?
          if [ "$rc" -eq 0 ]; then echo "Turkish text found"; exit 1; fi
          if [ "$rc" -ne 1 ]; then echo "git grep failed (exit $rc)"; exit 1; fi
          echo "No Turkish text"
      - name: Dead exports (an exported name nothing uses)
        run: node scripts/check-exports.mjs
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      # forge-std (a contracts test dependency) is a git dependency; fetch it over HTTPS, not SSH.
      - name: Git dependencies over HTTPS
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git config --global --add url."https://github.com/".insteadOf "ssh://git@github.com/"
      - run: pnpm install --frozen-lockfile
      # Solidity is compiled here and nowhere else. The exported artifacts (ABIs, bytecode, the pinned
      # runtime code hash) are committed: a contract change without a fresh export fails the diff.
      - name: Contracts (build, artifacts in sync, unit + fuzz tests)
        run: |
          pnpm -F @coinnibal/contracts build
          git diff --exit-code packages/contracts/src/artifacts.ts
          pnpm -F @coinnibal/contracts typecheck
          pnpm -F @coinnibal/contracts test
      - name: Shared
        run: pnpm -F @coinnibal/shared typecheck && pnpm -F @coinnibal/shared test
      - name: Art
        run: pnpm -F @coinnibal/art typecheck && pnpm -F @coinnibal/art test
      - name: SDK
        run: pnpm -F @coinnibal/sdk typecheck && pnpm -F @coinnibal/sdk test
      - name: Server
        run: pnpm -F @coinnibal/server typecheck && pnpm -F @coinnibal/server test && pnpm -F @coinnibal/server test:workers && pnpm -F @coinnibal/server build
      - name: Web
        run: pnpm -F @coinnibal/web typecheck && pnpm -F @coinnibal/web test && pnpm -F @coinnibal/web build

  docker:
    name: Docker image (build only, no push)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Build
        run: docker build -t coinnibal:ci .
      # Both Caddy configurations against the Caddy image docker-compose.yml pins, so a Caddy bump (a Dependabot
      # pull request) that refuses them never reaches the ci-green marker and the VPS
      - name: Caddy configurations (caddy validate, with the pinned image)
        run: |
          image="$(sed -n 's/^    image: \(caddy:[^ ]*\)$/\1/p' deploy/vps/docker-compose.yml)"
          test -n "$image"
          for f in Caddyfile Caddyfile.cloudflare; do
            docker run --rm -e GAME_DOMAIN=game.example.org -e SITE_DOMAIN=example.org \
              -v "$PWD/deploy/vps/caddy:/etc/caddy:ro" "$image" caddy validate --config "/etc/caddy/$f" --adapter caddyfile
          done

  # The VPS deploys only what passed: after every green run on a branch this moves the tag ci-green-<branch> to the
  # commit, and deploy/vps/update.sh deploys the newest commit it marks (a private repository's CI status is not
  # readable from the VPS without a token; the tag comes with the same git fetch as the code). Not on Dependabot's
  # branches: no server follows them, and their runs get a read-only token (.github/dependabot.yml).
  mark-green:
    name: Mark the commit deployable (ci-green-<branch>)
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') && !startsWith(github.ref, 'refs/heads/dependabot/')
    needs: [typescript, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Move ci-green-<branch> to this commit (never backwards)
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          tag="ci-green-${BRANCH}"
          git fetch --quiet origin "+refs/tags/${tag}:refs/tags/${tag}" 2>/dev/null || true
          if old="$(git rev-parse -q --verify "refs/tags/${tag}^{commit}")" && git merge-base --is-ancestor "$GITHUB_SHA" "$old" && [ "$old" != "$GITHUB_SHA" ]; then
            echo "the marker is already ahead of this commit"
            exit 0
          fi
          git tag -f "$tag" "$GITHUB_SHA"
          git push -f origin "refs/tags/${tag}"
