# Elymum game server on a VPS: the game server (app) behind Caddy (automatic HTTPS, WebSockets).
# Do not run `docker compose` on this file directly: use deploy/vps/compose.sh, which passes the project
# name and /opt/elymum/.env (for ${GAME_DOMAIN}). Paths below are relative to this folder.
name: elymum

# journald: the logs outlive a container (a redeploy replaces it) and, with the persistent journal install.sh and
# update.sh set up, a reboot. Read them with: elymum-compose logs app, or journalctl CONTAINER_NAME=elymum-app-1
x-logging: &logging
  driver: journald
  options:
    tag: "elymum-{{.Name}}"

services:
  app:
    image: elymum-app:latest
    build:
      context: ../..
      dockerfile: Dockerfile
      # the site is this image's bundle, served by the app itself on SITE_DOMAIN (same origin as the game, so
      # VITE_SERVER_URL stays empty); VITE_PUBLIC_URL is the site's canonical origin
      args:
        VITE_SERVER_URL: ""
        VITE_RPC_URL: ""
        VITE_PUBLIC_URL: "https://${SITE_DOMAIN:-coinnibal.fun}"
    env_file:
      - ../../.env
    environment:
      # fixed by this setup (Caddy is the one proxy in front): not taken from .env
      DATA_DIR: /data
      PORT: "8787"
      HOST: 0.0.0.0
      TRUST_PROXY: "1"
      TRUST_PROXY_HOPS: "1"
      # Robinhood Chain (the only network). These come from ELYMUM_* keys of /opt/elymum/.env, never from CHAIN_ID,
      # EVM_RPC_URL(S), RPC_MAX_RPS or GAME_ACCESS there: that file was filled from an older (Elysium / Render) setup and
      # may still hold stale values of those, which this block always shadows. Unset ELYMUM_* keys = the values below
      # (the live testnet). Mainnet: ELYMUM_CHAIN_ID=4663 and
      # ELYMUM_RPC_URLS=<your Alchemy URL>,https://rpc.mainnet.chain.robinhood.com (README "RPC").
      CHAIN_ID: "${ELYMUM_CHAIN_ID:-46630}"
      # several RPCs in order (a viem fallback); EVM_RPC_URL is always empty here (= unset) so a stale one never wins
      EVM_RPC_URLS: "${ELYMUM_RPC_URLS:-https://rpc.testnet.chain.robinhood.com}"
      EVM_RPC_URL: ""
      # calls per second per EVM_RPC_URLS entry (one number, or a comma list: "25,4")
      RPC_MAX_RPS: "${ELYMUM_RPC_MAX_RPS:-4}"
      # Elysium-era settings that must not carry over (empty = unset; the /admin registry decides)
      PUBLIC_RPC_URL: ""
      TESTNET_RPC_URL: ""
      EXPLORER_URL: ""
      ARENA_ADDRESS: ""
      NFT_ADDRESS: ""
      TOKEN_ADDRESS: ""
      JOURNAL_ABANDON_CONTRACT: ""
      # who may play: ELYMUM_GAME_ACCESS in .env (admins | holders | public | maintenance; site hands the choice to
      # /admin -> Settings). Default public: the game is open on the testnet (the owner's choice)
      GAME_ACCESS: "${ELYMUM_GAME_ACCESS:-public}"
      # the site lives here (no Vercel): the app serves the bundled web client (with a strict CSP) on every domain
      # Caddy hands it, SITE_DOMAIN first. PUBLIC_URL is that site (sign-ins, share cards, X posts name it);
      # ELYMUM_PUBLIC_URL in .env overrides it, a stale PUBLIC_URL there does not
      WEB_DIST: "${ELYMUM_WEB_DIST:-/app/web}"
      PUBLIC_URL: "${ELYMUM_PUBLIC_URL:-https://${SITE_DOMAIN:-coinnibal.fun}}"
    volumes:
      - elymum-data:/data
    expose:
      - "8787"
    restart: unless-stopped
    # SIGTERM: the server pays out every live stake player and flushes its files; give it time
    stop_grace_period: 45s
    stop_signal: SIGTERM
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    # the container has its own network namespace: the host's sysctl tuning does not reach it
    sysctls:
      net.core.somaxconn: 4096
      net.ipv4.tcp_keepalive_time: 120
      net.ipv4.tcp_keepalive_intvl: 30
      net.ipv4.tcp_keepalive_probes: 4
    # liveness only (the process answers): a server that waits on the RPC or has a full disk is up, not unhealthy;
    # /api/health with its reasons is what alert.sh reads. alert.sh restarts the app after 3 failed minutes (autoheal)
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/api/health?live=1').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging: *logging

  caddy:
    image: caddy:2.10
    depends_on:
      - app
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      GAME_DOMAIN: ${GAME_DOMAIN:?set GAME_DOMAIN in /opt/elymum/.env}
      # the site's domain (the web client on the same origin as the game); www.<it> redirects to it
      SITE_DOMAIN: ${SITE_DOMAIN:-coinnibal.fun}
    # Caddyfile (players connect straight to this server) or Caddyfile.cloudflare (behind Cloudflare, README
    # "Cloudflare in front"): CADDY_CONFIG in /opt/elymum/.env
    command: ["caddy", "run", "--config", "/etc/caddy/${CADDY_CONFIG:-Caddyfile}", "--adapter", "caddyfile"]
    volumes:
      # the folder, not the file: a git update replaces the file and a file mount would keep the old one
      - ./caddy:/etc/caddy:ro
      - caddy-data:/data
      - caddy-config:/config
    logging: *logging

volumes:
  elymum-data:
    # a fixed name: backup.sh, restore.sh and the README use it
    name: elymum-data
  caddy-data:
    name: elymum-caddy-data
  caddy-config:
    name: elymum-caddy-config
